<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Timesheet on a phone</title>
<style>
  /* Development only: the view at phone width, dark and light side by side,
     for the README screenshot (scripts/screenshots.mjs). Desktop browsers
     won't open a window this narrow, so the screens are iframes. */
  html, body { margin: 0; background: transparent; }
  body { display: flex; gap: 32px; padding: 24px; }
  iframe {
    width: 390px;
    height: 712px;
    border: 1px solid rgba(127, 127, 127, 0.35);
    border-radius: 24px;
  }
</style>
</head>
<body>
<script>
  const shot = new URLSearchParams(location.search).get('shot') || 'insights';
  for (const theme of ['dark', 'light']) {
    const frame = document.createElement('iframe');
    frame.title = `Timesheet, ${theme} theme`;
    frame.src = `../dist/dev.html?demo=busy&reset=1&timer=0&firstDay=1&shot=${shot}&theme=${theme}`;
    document.body.append(frame);
  }
</script>
</body>
</html>
